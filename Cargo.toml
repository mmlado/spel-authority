[package]
name = "spel-authority"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Policy-free single-holder authority slot primitives for SPEL libraries"
repository = "https://github.com/mmlado/spel-authority"
readme = "README.md"

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "8dfb80eed7fc259ca8afc7b7c2a9349eb49f9d44" }
